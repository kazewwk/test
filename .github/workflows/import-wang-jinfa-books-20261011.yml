name: Import Wang Jinfa cell biology PDFs
"on":
  push:
    branches: [main]
    paths: [.github/workflows/import-wang-jinfa-books-20261011.yml]
concurrency:
  group: import-wang-jinfa-books
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 'kazewwk/test'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Upload both PDFs and verify repository files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANSFER_URL: "https://earliest-decisions-cost-certainly.trycloudflare.com/DOhJj0AbLRAsHIae5lGzSmtEa01lH9xoRdYh1e-kR1w/books.tar"
          ARCHIVE_SIZE: "203898880"
          ARCHIVE_SHA256: "7d870563f5f348494044d5ac3501f2e01dcb47685729e3de81393873ea237d4a"
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import subprocess
          import tarfile
          import time
          import urllib.request
          from pathlib import Path
          
          root = Path.cwd()
          archive = root / 'books.tar'
          subprocess.run(['curl', '--fail', '--location', '--retry', '4', '--retry-all-errors',
                          '--connect-timeout', '30', '--max-time', '900', '--output', str(archive), os.environ['TRANSFER_URL']], check=True)
          assert archive.stat().st_size == int(os.environ['ARCHIVE_SIZE'])
          with archive.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == os.environ['ARCHIVE_SHA256']
          payload = root / 'payload'
          payload.mkdir()
          with tarfile.open(archive) as tar:
              tar.extractall(payload, filter='data')
          inventory = json.loads((payload / 'inventory.json').read_text())
          for entry in inventory:
              path = payload / entry['path']
              assert entry['path'].startswith('王金发细胞/')
              assert path.stat().st_size == entry['size'] < 100_000_000
              with path.open('rb') as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == entry['sha256']
          print('Verified all', len(inventory), 'repository files', flush=True)
          
          repo = root / 'repository'
          repo.mkdir()
          git_env = dict(os.environ)
          git_env.update({'GIT_CONFIG_COUNT': '1', 'GIT_CONFIG_KEY_0': 'http.https://github.com/.extraheader',
                          'GIT_CONFIG_VALUE_0': 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode(),
                          'GIT_AUTHOR_NAME': 'github-actions[bot]', 'GIT_COMMITTER_NAME': 'github-actions[bot]',
                          'GIT_AUTHOR_EMAIL': '41898282+github-actions[bot]@users.noreply.github.com',
                          'GIT_COMMITTER_EMAIL': '41898282+github-actions[bot]@users.noreply.github.com',
                          'GIT_TERMINAL_PROMPT': '0'})
          
          def git(*args, input=None, check=True):
              return subprocess.run(['git', *args], cwd=repo, env=git_env, input=input,
                                    stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=check)
          
          git('init', '-q')
          git('remote', 'add', 'origin', 'https://github.com/kazewwk/test.git')
          git('config', 'remote.origin.promisor', 'true')
          git('config', 'remote.origin.partialclonefilter', 'blob:none')
          for entry in inventory:
              result = git('hash-object', '-w', str(payload / entry['path']))
              assert result.stdout.decode().strip() == entry['git_blob_sha1']
          
          for attempt in range(3):
              print('Fetching latest main tree, attempt', attempt + 1, flush=True)
              git('fetch', '--quiet', '--depth=1', '--filter=blob:none', 'origin', 'main')
              parent = git('rev-parse', 'FETCH_HEAD').stdout.decode().strip()
              existing = git('ls-tree', '-r', '--name-only', parent, '--', '王金发细胞').stdout
              assert not existing, 'Target directory already exists; refusing to overwrite it'
              git('read-tree', parent)
              for entry in inventory:
                  git('update-index', '--add', '--cacheinfo', '100644', entry['git_blob_sha1'], entry['path'])
              readme = git('show', parent + ':README.md').stdout.decode()
              readme += '\n## 王金发细胞生物学教材 PDF\n\n'
              readme += '[王金发细胞](王金发细胞/README.md)保存《细胞生物学（王金发）》及《细胞生物学实验教程》第 2 版的原始 PDF。前者按 95 MB 无损分为两片，后者直接保存完整 PDF。目录内附原始文件名、大小、SHA-256 与还原脚本。\n'
              readme_sha = git('hash-object', '-w', '--stdin', input=readme.encode()).stdout.decode().strip()
              git('update-index', '--add', '--cacheinfo', '100644', readme_sha, 'README.md')
              tree = git('write-tree').stdout.decode().strip()
              commit = git('commit-tree', tree, '-p', parent, input='上传王金发细胞生物学两本原始 PDF，附无损分片与校验\n'.encode()).stdout.decode().strip()
              push = git('push', 'origin', commit + ':refs/heads/main', check=False)
              if push.returncode == 0:
                  print('Uploaded commit:', commit, flush=True)
                  break
              print(push.stderr.decode(), flush=True)
              time.sleep(2)
          else:
              raise RuntimeError('Unable to push after three attempts')
          
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                     'User-Agent': 'wang-jin-fa-book-upload'}
          request = urllib.request.Request('https://api.github.com/repos/kazewwk/test/git/trees/' + tree + '?recursive=1', headers=headers)
          # The existing repository is large; verify only the uploaded subtree, avoiding a truncated root response.
          from urllib.parse import quote
          url = 'https://api.github.com/repos/kazewwk/test/contents/' + quote('王金发细胞') + '?ref=' + commit
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
              contents = json.load(response)
          observed = {}
          for item in contents:
              if item['type'] == 'dir':
                  with urllib.request.urlopen(urllib.request.Request(item['url'], headers=headers), timeout=60) as response:
                      for child in json.load(response):
                          observed[child['path']] = child
              else:
                  observed[item['path']] = item
          for entry in inventory:
              item = observed[entry['path']]
              assert item['size'] == entry['size'] and item['sha'] == entry['git_blob_sha1'], 'Remote verification failed'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('两本原始 PDF 已上传；全部文件大小与 Git blob SHA-1 已逐一核对。\n\n')
              summary.write('[书籍目录](https://github.com/kazewwk/test/tree/main/%E7%8E%8B%E9%87%91%E5%8F%91%E7%BB%86%E8%83%9E)\n')
          print('All uploaded files verified on GitHub', flush=True)
          PY
