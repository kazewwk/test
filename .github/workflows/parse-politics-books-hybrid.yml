    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts
      - uses: actions/cache@v4
        with:
          path: ~/.mineru/models
          key: mineru-4.0.10-onnx-llama-q8-cpu-v1
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false
      - name: Install CPU MinerU Hybrid runtime
        run: |
          uv venv "$POLITICS_WORKDIR/venv" --python 3.12
          uv pip install --python "$POLITICS_WORKDIR/venv/bin/python" mineru==4.0.10 pymupdf==1.28.2
          mkdir -p "$POLITICS_WORKDIR/source"
      - name: Download and verify release PDF, then parse selected original pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$BOOK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '${{ matrix.asset }}' --dir "$POLITICS_WORKDIR/source"
          "$POLITICS_WORKDIR/venv/bin/python" scripts/process_politics_books.py parse --book ${{ matrix.book }} --first ${{ matrix.first }} --last ${{ matrix.last }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: politics-book-${{ matrix.book }}-pages-${{ matrix.first }}-${{ matrix.last }}
          path: ${{ env.POLITICS_WORKDIR }}/parsed
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  assemble-and-publish:
    needs: parse
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: false
      - name: Download five original books and install assembly runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv venv "$POLITICS_WORKDIR/venv" --python 3.12
          uv pip install --python "$POLITICS_WORKDIR/venv/bin/python" mineru==4.0.10 pymupdf==1.28.2
          mkdir -p "$POLITICS_WORKDIR/source"
          gh release download "$BOOK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.pdf' --dir "$POLITICS_WORKDIR/source"
      - uses: actions/download-artifact@v4
        with:
          pattern: politics-book-*
          path: ${{ env.POLITICS_WORKDIR }}/parsed
          merge-multiple: true
      - name: Assemble chapters, preserve every original page and validate outputs
        run: |
          for book in 1 2 3 4 5; do
            "$POLITICS_WORKDIR/venv/bin/python" scripts/process_politics_books.py finalize --book "$book"
          done
      - name: Upload five completed ZIPs and verification files to original release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$BOOK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "$POLITICS_WORKDIR/"*-MinerU-Hybrid.zip "$POLITICS_WORKDIR/"*-MinerU-Hybrid-SHA256SUMS.txt "$POLITICS_WORKDIR/"*-MinerU-Hybrid-manifest.json "$POLITICS_WORKDIR/"*-MinerU-Hybrid-validation.json
          python3 - <<'PYCODE'
          import os,json,subprocess
          from pathlib import Path
          root=Path(os.environ['POLITICS_WORKDIR'])
          release=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/{os.environ["BOOK_RELEASE_TAG"]}']))
          for i in range(1,6):
              info=json.loads((root/f'archive-{i}.json').read_text())
              asset=next(a for a in release['assets'] if a['name']==info['file'])
              assert asset['size']==info['size'] and asset['digest']=='sha256:'+info['sha256']
              print('Verified release ZIP:',asset['browser_download_url'])
          PYCODE
      - name: Commit complete book folders to main
        run: |
          python3 - <<'PYCODE'
          import os,json,shutil,subprocess
          from pathlib import Path
          root=Path(os.environ['POLITICS_WORKDIR']);workspace=Path(os.environ['GITHUB_WORKSPACE'])
          infos=[json.loads((root/f'archive-{i}.json').read_text()) for i in range(1,6)]
          for info in infos:
              target=workspace/info['folder']
              assert not target.exists(),str(target)
              shutil.copytree(root/'parsed'/info['folder'],target)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--sparse','--',*[i['folder'] for i in infos]],check=True)
          subprocess.run(['git','commit','--quiet','-m','Add five complete politics textbooks parsed with MinerU Hybrid'],check=True)
          subprocess.run(['git','pull','--rebase','--quiet','origin','main'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE
      - name: Verify published book folder trees
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import os,json,subprocess
          from pathlib import Path
          root=Path(os.environ['POLITICS_WORKDIR'])
          tree=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/trees/main']))
          for i in range(1,6):
              folder=json.loads((root/f'archive-{i}.json').read_text())['folder']
              expected=subprocess.check_output(['git','rev-parse',f'HEAD:{folder}'],text=True).strip()
              actual=next(t['sha'] for t in tree['tree'] if t['path']==folder)
              assert actual==expected
              print('Verified repository folder:',folder,actual)
          PYCODE
          echo 'Completed five books, 1724 original pages and 48 main chapters; ZIPs and repository trees verified.' >> "$GITHUB_STEP_SUMMARY"
