name: Parse five politics textbooks with MinerU Hybrid CPU

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/parse-politics-books-hybrid.yml
      - scripts/process_politics_books.py
      - scripts/politics_books_plan.json
      - scripts/restore_politics_original_pdf.py
  workflow_dispatch:

concurrency:
  group: politics-books-hybrid
  cancel-in-progress: false

permissions:
