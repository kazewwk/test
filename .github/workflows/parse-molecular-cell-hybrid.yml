name: Parse Molecular Biology of the Cell with MinerU Hybrid

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/parse-molecular-cell-hybrid.yml
      - scripts/process_molecular_cell.py
      - scripts/restore_original_pdf.py
  workflow_dispatch:

concurrency:
  group: molecular-cell-hybrid
  cancel-in-progress: false

permissions:
  contents: read

env:
  MOLECULAR_CELL_WORKDIR: /tmp/molecular-cell
  BOOK_RELEASE_TAG: molecular-biology-of-the-cell-7e-2026-10-09
  PYTHONUNBUFFERED: "1"

jobs:
  parse:
    if: github.repository == 'kazewwk/test'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - section: 1
            pages: "all"
          - section: 0
            pages: "24"
          - section: 2
            pages: "all"
          - section: 0
            pages: "25"
          - section: 3
            pages: "all"
          - section: 0
            pages: "26"
          - section: 4
            pages: "all"
          - section: 0
            pages: "27"
          - section: 5
            pages: "all"
          - section: 0
            pages: "28"
          - section: 6
            pages: "all"
          - section: 0
            pages: "29"
          - section: 7
            pages: "all"
          - section: 0
            pages: "30"
          - section: 8
            pages: "all"
          - section: 0
            pages: "31"
          - section: 9
            pages: "all"
          - section: 0
            pages: "32"
          - section: 10
            pages: "all"
          - section: 0
            pages: "33"
          - section: 11
            pages: "all"
          - section: 0
            pages: "34"
          - section: 12
            pages: "all"
          - section: 0
            pages: "35"
          - section: 13
            pages: "all"
          - section: 0
            pages: "36"
          - section: 14
            pages: "all"
          - section: 0
            pages: "37"
          - section: 15
            pages: "all"
          - section: 0
            pages: "38"
          - section: 16
            pages: "all"
          - section: 0
            pages: "39"
          - section: 17
            pages: "all"
          - section: 18
            pages: "all"
          - section: 19
            pages: "all"
          - section: 20
            pages: "all"
          - section: 21
            pages: "all"
          - section: 22
            pages: "all"
          - section: 23
            pages: "all"
          - section: 24
            pages: "all"
          - section: 25
            pages: "all"
          - section: 26
            pages: "all"
          - section: 27
            pages: "all"
          - section: 0
            pages: "1"
          - section: 0
            pages: "2"
          - section: 0
            pages: "3"
          - section: 0
