name: Upload five kaoyan politics textbooks

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/upload-kaoyan-politics-pdfs.yml

concurrency:
  group: kaoyan-politics-pdf-release
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'kazewwk/test'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      BOOK_MANIFEST: |
        {
          "repository": "kazewwk/test",
          "tag_name": "kaoyan-politics-books-2026-10-09",
          "title": "考研政治教材：5 本 PDF（2026-10-09）",
          "source_folder": "考研政治书",
          "books": [
            {
              "title": "中国近现代史纲要（2023年版）",
              "asset_name": "01-outline-modern-chinese-history-2023.pdf",
              "original_name": "中国近现代史纲要(2023年版) (《中国近现代史纲要_ (z-library.sk, 1lib.sk, z-lib.sk).pdf",
              "source_path": "/中国近现代史纲要(2023年版) (《中国近现代史纲要_ (z-library.sk, 1lib.sk, z-lib.sk).pdf",
              "size": 52884581,
              "sha256": "a864821148e3dc62d78f9e58091c8729471510b54c683b35fbc87447b8e98b38",
              "pages": 429
            },
            {
              "title": "习近平新时代中国特色社会主义思想概论",
              "asset_name": "02-xi-jinping-thought-introduction.pdf",
              "original_name": "习近平新时代中国特色社会主义思想概论 (《习近平新时代_ (z-library.sk, 1lib.sk, z-lib.sk).pdf",
              "source_path": "/习近平新时代中国特色社会主义思想概论 (《习近平新时代_ (z-library.sk, 1lib.sk, z-lib.sk).pdf",
              "size": 19783312,
              "sha256": "a56e83f1d97068d98ea008362c6dd77e967d5b0641305f3d8eb43d32b7029687",
              "pages": 384
            },
            {
              "title": "思想道德与法治（2023）优化版",
              "asset_name": "03-ideology-morality-rule-of-law-2023.pdf",
              "original_name": "思想道德与法治(2023)优化版 (《思想道德与法治》_ (z-library.sk, 1lib.sk, z-lib.sk).pdf",
              "source_path": "/思想道德与法治(2023)优化版 (《思想道德与法治》_ (z-library.sk, 1lib.sk, z-lib.sk).pdf",
              "size": 103627816,
              "sha256": "25c86db01cdc01b6712cabacdbd56a6ef00e164ae16d5c1710e9e5095a789487",
              "pages": 264
            },
            {
              "title": "毛泽东思想和中国特色社会主义理论体系概论",
              "asset_name": "04-mao-zedong-thought-theoretical-system.pdf",
              "original_name": "毛泽东思想和中国特色社会主义理论体系概论 (高等教育出版社) (z-library.sk, 1lib.sk, z-lib.sk).pdf",
              "source_path": "/毛泽东思想和中国特色社会主义理论体系概论 (高等教育出版社) (z-library.sk, 1lib.sk, z-lib.sk).pdf",
              "size": 62548416,
              "sha256": "73d55bf73813715bd3f4a299c69cabb2923e3d5038fea24dfc5774b67e813747",
              "pages": 284
            },
            {
              "title": "马克思主义基本原理（2023年版，数字版）",
              "asset_name": "05-basic-principles-marxism-2023.pdf",
              "original_name": "马克思主义基本原理(2023年版)【数字版】 (马克思_ (z-library.sk, 1lib.sk, z-lib.sk).pdf",
              "source_path": "/马克思主义基本原理(2023年版)【数字版】 (马克思_ (z-library.sk, 1lib.sk, z-lib.sk).pdf",
              "size": 21321484,
              "sha256": "bedda28367489ec5abdf3dfa107d3c1e58874ce6051cd200cb843a778f0b47e6",
              "pages": 363
            }
          ],
          "total_bytes": 260165609
        }
    steps:
      - name: Download and verify all five original PDFs
        env:
          SOURCE_BASE_URL: "https://effect-analyst-wrap-newsletter.trycloudflare.com/iEVhhV66AGuqNWX-NEPFWDaBnz_Ku1y6V6pN4ev5X4g/"
        run: |
          python3 -u - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import time
          
          manifest = json.loads(os.environ['BOOK_MANIFEST'])
          base = os.environ['SOURCE_BASE_URL'].rstrip('/') + '/'
          
          def download(book):
              target = Path(book['asset_name'])
              for attempt in range(4):
                  if target.exists() and target.stat().st_size == book['size']:
                      break
                  print('Downloading:', book['title'], 'attempt:', attempt + 1, flush=True)
                  result = subprocess.run([
                      'curl', '--fail', '--location', '--silent', '--show-error',
                      '--continue-at', '-', '--connect-timeout', '30', '--max-time', '1200',
                      '--output', str(target), base + book['asset_name'],
                  ])
                  if result.returncode == 0:
                      break
                  if attempt == 3:
                      raise RuntimeError('Download failed: ' + book['asset_name'])
                  time.sleep(5)
              assert target.stat().st_size == book['size'], 'Size mismatch: ' + book['asset_name']
              digest = hashlib.sha256()
              with target.open('rb') as source:
                  assert source.read(8).startswith(b'%PDF-'), 'Invalid PDF: ' + book['asset_name']
                  source.seek(0)
                  for chunk in iter(lambda: source.read(1024 * 1024), b''):
                      digest.update(chunk)
              assert digest.hexdigest() == book['sha256'], 'SHA-256 mismatch: ' + book['asset_name']
              print('Verified:', book['title'], book['size'], 'bytes', flush=True)
          
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              list(pool.map(download, manifest['books']))
          Path('manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          Path('SHA256SUMS.txt').write_text(''.join(b['sha256'] + '  ' + b['asset_name'] + '\n' for b in manifest['books']))
          print('All five original PDFs verified.', flush=True)
          PY
      - name: Upload, verify and publish all seven assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -u - <<'PY'
          import hashlib
          import http.client
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.parse
          import urllib.request
          
          manifest = json.loads(os.environ['BOOK_MANIFEST'])
          repo = manifest['repository']
          tag = manifest['tag_name']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'User-Agent': 'kaoyan-politics-book-release-upload',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          
          def api(method, endpoint, data=None):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + endpoint,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={**headers, 'Content-Type': 'application/json'}, method=method)
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)
          
          download_base = 'https://github.com/' + repo + '/releases/download/' + tag + '/'
          notes = [
              '原始考研政治教材 PDF，共 5 本，合计 ' + str(manifest['total_bytes']) + ' 字节（248.11 MiB）。',
              '', '所有 PDF 未经修改。上传后已核对 GitHub 保存的文件大小和 SHA-256。', '',
              '| 书籍 | 页数 | 大小 | 下载 |', '| --- | ---: | ---: | --- |',
          ]
          for book in manifest['books']:
              notes.append('| ' + book['title'] + ' | ' + str(book['pages']) + ' | ' +
                           format(book['size'] / 1048576, '.2f') + ' MiB | [PDF](' + download_base + book['asset_name'] + ') |')
          notes.extend(['', '[完整文件清单](' + download_base + 'manifest.json) · [SHA-256 校验文件](' + download_base + 'SHA256SUMS.txt)',
                        '', 'Release 附件标签和文件清单保留原始文件名。'])
          
          try:
              release = api('GET', '/releases/tags/' + tag)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              release = api('POST', '/releases', {
                  'tag_name': tag, 'target_commitish': os.environ['GITHUB_SHA'],
                  'name': manifest['title'], 'draft': True, 'prerelease': False,
                  'make_latest': 'false', 'body': '\n'.join(notes) + '\n',
              })
          
          expected = [{**b, 'label': b['original_name']} for b in manifest['books']]
          for name in ['manifest.json', 'SHA256SUMS.txt']:
              data = Path(name).read_bytes()
              expected.append({'asset_name': name, 'label': name, 'size': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          
          existing = {a['name']: a for a in release['assets']}
          verified = []
          for item in expected:
              name = item['asset_name']
              asset = existing.get(name)
              if asset is None:
                  url = urllib.parse.urlsplit(release['upload_url'].split('{')[0])
                  assert url.scheme == 'https' and url.hostname == 'uploads.github.com'
                  path = url.path + '?' + urllib.parse.urlencode({'name': name, 'label': item['label']})
                  connection = http.client.HTTPSConnection(url.hostname, timeout=600, blocksize=1024 * 1024)
                  print('Uploading:', name, flush=True)
                  try:
                      with Path(name).open('rb') as file:
                          connection.request('POST', path, body=file, headers={
                              **headers, 'Content-Type': 'application/pdf' if name.endswith('.pdf') else 'application/octet-stream',
                              'Content-Length': str(item['size']),
                          })
                      response = connection.getresponse()
                      payload = response.read()
                      if response.status != 201:
                          raise RuntimeError('GitHub upload failed: HTTP ' + str(response.status) + '; ' + payload.decode()[:1000])
                      asset = json.loads(payload)
                  finally:
                      connection.close()
              asset = api('GET', '/releases/assets/' + str(asset['id']))
              assert asset['name'] == name
              assert asset['state'] == 'uploaded', 'Upload incomplete: ' + name
              assert asset['size'] == item['size'], 'GitHub size mismatch: ' + name
              assert asset['digest'] == 'sha256:' + item['sha256'], 'GitHub SHA-256 mismatch: ' + name
              assert asset['label'] == item['label'], 'GitHub label mismatch: ' + name
              verified.append(asset)
              print('GitHub asset verified:', name, flush=True)
          
          assert len(verified) == 7
          if release['draft']:
              release = api('PATCH', '/releases/' + str(release['id']), {'draft': False, 'make_latest': 'false'})
          assert not release['draft'], 'Release was not published'
          print('Published:', release['html_url'], flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('All five original PDFs uploaded and verified.\n\n[Release](' + release['html_url'] + ')\n')
          PY
