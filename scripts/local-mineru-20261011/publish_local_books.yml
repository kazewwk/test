name: Publish Wang Jinfa books parsed locally

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-local-cell-books.yml
      - scripts/local-mineru-20261011/publication.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-mineru-cell-books-20261011
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'kazewwk/test'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            细胞生物学（王金发）
            细胞生物学实验教程_第2版
            scripts/local-mineru-20261011
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify local ZIPs and extract complete chapters
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/local-mineru-20261011/publish_action.py prepare
      - name: Commit both book folders
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse '细胞生物学（王金发）' '细胞生物学实验教程_第2版'
          if ! git diff --cached --quiet; then
            git commit -m 'Add complete locally parsed cell biology books with images and formulas'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload and verify both Release ZIPs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/local-mineru-20261011/publish_action.py publish
      - name: Record verification
        if: always()
        run: |
          if [ -f /tmp/local-mineru-books/verification.md ]; then
            cat /tmp/local-mineru-books/verification.md >> "$GITHUB_STEP_SUMMARY"
          fi
